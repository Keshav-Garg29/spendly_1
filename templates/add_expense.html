{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Add Expense</h1>
                <p class="auth-subtitle">Record a new expenditure to track your spending</p>
            </div>

            {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
            {% endif %}

            <form class="auth-form" method="POST">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" step="0.01" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" max="{{ today }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" name="description" class="form-input" placeholder="What was this for?">
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
                <div class="auth-footer">
                    <a href="{{ url_for('profile') }}" class="auth-link">Cancel and go back</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
