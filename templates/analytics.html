{% extends "base.html" %}
{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="analytics-section">
    <div class="analytics-container">
        <div class="coming-soon-card">
            <div class="coming-soon-icon">◈</div>
            <h1 class="coming-soon-title">Coming Soon</h1>
            <p class="coming-soon-subtitle">
                We're building a powerful analytics suite to help you visualize your spending patterns,
                track trends, and optimize your financial health.
            </p>
            <div class="coming-soon-visual">
                <div class="visual-placeholder">
                    <div class="placeholder-bar" style="height: 60%"></div>
                    <div class="placeholder-bar" style="height: 80%"></div>
                    <div class="placeholder-bar" style="height: 40%"></div>
                    <div class="placeholder-bar" style="height: 90%"></div>
                    <div class="placeholder-bar" style="height: 70%"></div>
                </div>
            </div>
            <div class="coming-soon-actions">
                <a href="{{ url_for('profile') }}" class="btn-primary">Back to Profile</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
